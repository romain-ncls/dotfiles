# Home PC: the TV (RTX 3070 Ti HDMI audio) is the default audio output.
# A higher priority makes it the default until a sink is picked by hand;
# WirePlumber stores that choice in ~/.local/state/wireplumber/default-nodes.
# The LG C6 decodes Dolby itself: the sink takes AC-3 and E-AC-3 (Atmos)
# bitstreams, which mpv passes through (mpv.conf, dolby-to-tv). TrueHD as
# the TV's EDID lists it, though the stereo HDMI profile can't carry it.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "alsa_output.pci-0000_01_00.1.hdmi-stereo" } ]
    actions = {
      update-props = {
        priority.session = 2000, priority.driver = 2000
        iec958.codecs = [ "PCM" "AC3" "EAC3" "TrueHD" ]
      }
    }
  }
]
