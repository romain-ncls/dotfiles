# Home PC: the TV (RTX 3070 Ti HDMI audio) is the default audio output.
# A higher priority makes it the default until a sink is picked by hand;
# WirePlumber stores that choice in ~/.local/state/wireplumber/default-nodes.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "alsa_output.pci-0000_01_00.1.hdmi-stereo" } ]
    actions = { update-props = { priority.session = 2000, priority.driver = 2000 } }
  }
]
