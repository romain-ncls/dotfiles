# Hand-written part of /boot/limine.conf on the home PC. The rest of that file
# (the Arch Linux entry, its kernels and the Snapshots group) is generated by
# limine-entry-tool and limine-snapper-sync; scripts/limine-conf merges the two.
timeout: 1
remember_last_entry: yes
interface_branding: Menadion

/Windows 11
    protocol: efi
    path: boot():/EFI/Microsoft/Boot/bootmgfw.efi
    resolution: 1920x1080
