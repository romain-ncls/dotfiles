# The home PC: MSI Z690, i9-12900K, RTX 3070 Ti, 4K OLED TV (LG C6 77").
# Dual boot with Windows 11 on a shared ESP; btrfs, snapper, Limine.
modules:
  - base
  - boot
  - dns
  - desktop
  - kde
  - nalthis
  - darkly
  - panel
  - konsole
  - shell
  - kdeconnect
  - numlock
  - mpv
  - readest
  - tools
  - git
  - claude
  - docker
  - logi-smartshift
  - nvidia
  - wake-on-lan
  - blackout # the LG C6 is an OLED: black screen after 5 min idle
  - krdp
  - sshd
  - lodestar

vars:
  name: Romain Nicolas
  email: nicolasromain0@gmail.com
  konsole_colors: Nalthis # modules/konsole; DarkOneNuanced without nalthis
  panel_hiding: autohide # modules/panel: the OLED TV keeps no static taskbar

user:
  name: romain
  shell: /usr/bin/fish
  groups:
    - wheel
    - docker

boot:
  limine: limine.conf # globals and the Windows entry

files:
  /etc/sudoers.d/50-reboot-to-windows:
    mode: 0440
    check: visudo -cf {}
  ~/.ssh/authorized_keys:
    mode: 0600

json:
  # Sizes for the 4K TV, on top of the readest module's settings.
  - path: ~/.config/com.bilingify.readest/settings.json
    merge: readest.json

brave:
  flags:
    # Brave leaves colour to KDE, so pages and SDR video get the desktop's SDR
    # colour intensity; HDR video in the browser plays as SDR (docs/decisions.md).
    - --disable-features=WaylandWpColorManagerV1

kde:
  kwinrc:
    Xwayland:
      Scale: 2 # 4K TV at 200% (display.sh sets the outputs)
    Plugins:
      screenedgeEnabled: false # no glow at the bottom edge, where the hidden taskbar waits
  # The desktop is on the TV: never lock, dim, turn the screen off or suspend
  # on its own (that would cut the HDMI signal). blackout blacks it out instead.
  kscreenlockerrc:
    Daemon:
      Autolock: false
      Timeout: 0
  powerdevilrc:
    AC/Display:
      DimDisplayWhenIdle: false
      DimDisplayIdleTimeoutSec: -1
      TurnOffDisplayWhenIdle: false
      TurnOffDisplayIdleTimeoutSec: -1
    AC/SuspendAndShutdown:
      AutoSuspendAction: 0

hooks:
  - run: display.sh # scale, HDR, colour profile, VRR
