# The work laptop: HP ProBook 460 G11, Core Ultra 5 125U (Meteor Lake), Arc
# iGPU, 30 GiB of RAM. LUKS2 with btrfs, a swapfile for hibernation, Limine.
modules:
  - base
  - boot
  - secureboot
  - dns
  - desktop
  - kde
  - konsole
  - shell
  - kdeconnect
  - laptop
  - plymouth
  - numlock
  - mpv
  - readest
  - tools
  - cli
  - dev
  - work
  - mysql-shell
  - git
  - claude
  - docker
  - mkcert
  - gpg-ssh
  - media
  - discord
  - languagetool
  - at
  - keychron
  - steam
  - droidcam
  - packet
  - bemoji
  - logi-smartshift
  - awpro
  - mutectl
  - spotify-vol
  - backdrop
  - soundboard
  - lodestar

vars:
  name: Romain Nicolas
  email: nicolasromain0@gmail.com
  secureboot: "yes" # Limine's config hash enrolled (modules/boot)

user:
  name: romain
  shell: /usr/bin/fish
  groups:
    - wheel
    - docker
    - input # spotify-vol reads Super+Shift+Scroll from /dev/input

install:
  disk: nvme-SK_hynix_BC901_HFS512GEJ9X108N_4MD5N00041230573O
  esp: 4GiB
  encrypt: true
  swapfile: 32GiB # hibernation: the size of the RAM

boot:
  limine: limine.conf

packages:
  - qt6-webengine # the HTML wallpaper plugin
  - spectacle
  - tesseract # text recognition in Spectacle
  - tesseract-data-eng
  - tesseract-data-fra

kde:
  kwinrc:
    Effect-blur:
      BlurStrength: 11
      NoiseStrength: 4
    Effect-wobblywindows:
      AdvancedMode: true
      Stiffness: 20
    Effect-kwin4_effect_translucency:
      Inactive: 52
    Plugins:
      blurEnabled: true
      wobblywindowsEnabled: true
      shakecursorEnabled: false
  kcminputrc:
    Keyboard:
      RepeatDelay: 600
      RepeatRate: 25
    "Libinput/1133/16478/Logitech M720 Triathlon":
      PointerAcceleration: 0.400
    "Libinput/1133/45111/Logitech MX Anywhere 3S":
      PointerAcceleration: 0.400
    "Libinput/1133/16500/Logitech G305":
      PointerAcceleration: 0.200
    "Libinput/1739/53194/SYNA311E:00 06CB:CFCA Touchpad":
      NaturalScroll: true
      PointerAcceleration: 1.000
      PointerAccelerationProfile: 1
      ScrollFactor: 0.3
  kscreenlockerrc:
    Daemon:
      Timeout: 6
    Greeter/LnF/General:
      alwaysShowClock: false
      hideClockWhenIdle: true
      showMediaControls: false
  powerdevilrc:
    AC/Display:
      DimDisplayWhenIdle: false
      DimDisplayIdleTimeoutSec: -1
      TurnOffDisplayWhenIdle: false
      TurnOffDisplayIdleTimeoutSec: -1
    AC/SuspendAndShutdown:
      AutoSuspendAction: 0
    Battery/Display:
      DimDisplayIdleTimeoutSec: 300
  plasmanotifyrc:
    DoNotDisturb:
      WhenFullscreen: false
  plasma_calendar_holiday_regions:
    General:
      selectedRegions: fr_fr
  plasma-localerc:
    Formats:
      LANG: en_US.UTF-8
  dolphinrc:
    General:
      ShowFullPathInTitlebar: true
  kdeglobals:
    General:
      BrowserApplication: brave-browser.desktop
  mimeapps.list:
    Default Applications:
      text/html: brave-browser.desktop
      x-scheme-handler/http: brave-browser.desktop
      x-scheme-handler/https: brave-browser.desktop
  kglobalshortcutsrc:
    services/org.kde.spectacle.desktop:
      _launch: Print
      RectangularRegionScreenShot: "Meta+Shift+S\tMeta+Shift+Print"
    services/org.kde.screenreader.desktop:
      toggleScreenReader: none

shortcuts:
  - name: Claude in Brave
    keys: Meta+Shift+Return
    run: brave "https://claude.ai/new"
  - name: Perplexity in Brave
    keys: Meta+Ctrl+Shift+Return
    run: brave "https://www.perplexity.ai"
  - name: Full brightness
    keys: Meta+Num+*
    run: qdbus6 local.org_kde_powerdevil /org/kde/Solid/PowerManagement/Actions/BrightnessControl setBrightness 10000
  # clipboard, keyboard
  - {component: plasmashell, action: clipboard_action, keys: Ctrl+Alt+X}
  - {component: plasmashell, action: repeat_action, keys: Ctrl+Alt+R}
  - {component: plasmashell, action: show-on-mouse-pos, keys: []}
  - {component: KDE Keyboard Layout Switcher, action: Switch to Next Keyboard Layout, keys: Launch (5)}
  - {component: kmix, action: mic_mute, keys: Microphone Mute}
  # Brave's own global shortcuts, unbound
  - {component: brave-browser, action: autofill_login, keys: []}
  - {component: brave-browser, action: execute_side_panel, keys: []}
  - {component: brave-browser, action: generate_password, keys: []}
  - {component: brave-browser, action: save_page, keys: []}
