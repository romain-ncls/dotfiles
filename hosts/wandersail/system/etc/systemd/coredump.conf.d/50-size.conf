# Electron apps (Discord, GitKraken, node) reserve huge address spaces, so
# their crash dumps hit the 32G default cap: systemd-coredump then spends
# minutes writing to the encrypted disk and the desktop stalls. Big cores are
# truncated instead; small ones (KDE apps, our tools) are unaffected.
[Coredump]
ProcessSizeMax=1G
ExternalSizeMax=1G
