# Hand-written part of /boot/limine.conf on the laptop. The rest (the Arch
# Linux entry, its kernels and the Snapshots group) is generated by
# limine-entry-tool and limine-snapper-sync; lodestar merges the two.
timeout: 1
remember_last_entry: yes
# Until an entry is remembered (a fresh install): the first kernel. Entry 1 is
# the Arch Linux folder, which Limine can't boot by itself.
default_entry: 2
interface_branding: Wandersail
