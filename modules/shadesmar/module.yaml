# shadesmar: the Hyprland session's shell, in Quickshell (QML; plan:
# docs/hyprland.md). shell/ is linked to ~/.config/quickshell/shadesmar and
# edited in place: Quickshell reloads it on save. The bar and its popups
# (clipboard, notifications, network, Bluetooth, sound, battery), the
# overview, the launcher, notifications and the OSD (the lock screen is
# modules/silksong's); the stand-ins left (hypridle, nm-applet for its
# prompts) go as it grows. pkg/ builds spanreed, its Go helper for D-Bus
# names (Plasma's OSD service) and the Bluetooth pairing agent (BlueZ's,
# asking through the bar's Bluetooth). All in the Hyprland session only.
packages:
  - cliphist # the clipboard's history

files:
  ~/.config/quickshell/shadesmar:
    link: shell

user-services:
  - shadesmar.service
  - spanreed.service
  - clipboard-history.service
