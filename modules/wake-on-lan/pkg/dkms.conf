# igc with Wake-on-LAN on a 100 Mbit/s sleep link (modules/wake-on-lan).
# The PKGBUILD fills in the version and the kernel series of its source.
PACKAGE_NAME="igc-wol"
PACKAGE_VERSION="@VERSION@"
BUILT_MODULE_NAME[0]="igc"
DEST_MODULE_LOCATION[0]="/kernel/drivers/net/ethernet/intel/igc"
AUTOINSTALL="yes"
# Only for kernels of the source's series: on another one, no build, and
# Arch's igc loads (network fine, no Wake-on-LAN).
BUILD_EXCLUSIVE_KERNEL="^@SERIES@\."
