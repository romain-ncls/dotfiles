# Oathgate: Brave's new tab, an unpacked extension in ~/.local/share/oathgate
# (loaded by hand, docs/manual-steps.md). Islands of links over Backdrop's
# wallpaper, in the session's colors. The links are private (names of
# servers and clients): ~/.config/oathgate/links.js, not in this repo; their
# format is at the top of newtab.js.
hooks:
  - run: link-data # the links, Backdrop's state and lumar's palette, into the extension
    when: always
