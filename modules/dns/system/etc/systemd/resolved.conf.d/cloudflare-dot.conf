# Cloudflare over DNS-over-TLS (port 853). The #name is the TLS certificate
# name to check. Strict: no fallback to plain DNS if 853 is blocked.
[Resolve]
DNS=1.1.1.1#cloudflare-dns.com 1.0.0.1#cloudflare-dns.com 2606:4700:4700::1111#cloudflare-dns.com 2606:4700:4700::1001#cloudflare-dns.com
DNSOverTLS=yes
