# KDE settings shared by every machine. Only keys changed on purpose belong
# here; KDE writes everything else itself (lodestar kde review shows changes).
packages:
  - kconfig # kwriteconfig6, which lodestar writes KDE keys with

kde:
  kdeglobals:
    KDE:
      LookAndFeelPackage: org.kde.breezedark.desktop
  ksmserverrc:
    General:
      loginMode: emptySession
  konsolerc:
    KonsoleWindow:
      ShowMenuBarByDefault: false
  # Navigation and window management, the same on every machine.
  kwinrc:
    Desktops:
      Number: 4
      Rows: 2
    Windows:
      Placement: Centered
      RollOverDesktops: false
    EdgeBarrier:
      EdgeBarrier: 0
    ElectricBorders:
      TopLeft: None
    Effect-overview:
      BorderActivate: 9
    Effect-presentwindows:
      BorderActivateAll: 9
    Effect-windowview:
      BorderActivateAll: 9
    Effect-slide:
      SlideBackground: false
    Plugins:
      desktopchangeosdEnabled: false
      minimizeallEnabled: false
    TabBox:
      LayoutName: thumbnail_grid
      MultiScreenMode: 1
    org.kde.kdecoration2:
      ButtonsOnLeft: MFS
      BorderSize: Normal
  kxkbrc:
    Layout:
      LayoutList: fr
      Use: true
  kglobalshortcutsrc:
    services/org.kde.konsole.desktop:
      _launch: "Ctrl+Alt+T\tMeta+Return" # both shortcuts start Konsole
    services/org.kde.krunner.desktop:
      _launch: "Search\tAlt+Space\tAlt+F2\tMeta+Space"

shortcuts:
  # session
  - {component: ksmserver, action: Halt Without Confirmation, keys: Ctrl+Alt+Shift+PgDown}
  - {component: ksmserver, action: Reboot Without Confirmation, keys: Ctrl+Alt+Shift+PgUp}
  - {component: ksmserver, action: Log Out Without Confirmation, keys: Ctrl+Alt+Shift+Del}
  # windows
  - {component: kwin, action: Window Maximize, keys: Meta+Up}
  - {component: kwin, action: Window Minimize, keys: Meta+Down}
  - {component: kwin, action: Window Quick Tile Top, keys: Meta+PgUp}
  - {component: kwin, action: Window Quick Tile Bottom, keys: Meta+PgDown}
  - {component: kwin, action: Window Above Other Windows, keys: Meta+Shift+PgUp}
  - {component: kwin, action: Window On All Desktops, keys: Meta+Ctrl+Shift+PgUp}
  - {component: kwin, action: Window to Next Screen, keys: [Meta+Shift+D, Meta+Shift+Right]}
  - {component: kwin, action: Window to Previous Screen, keys: [Meta+Shift+Q, Meta+Shift+Left]}
  - {component: kwin, action: Kill Window, keys: Ctrl+Alt+Esc}
  - {component: kwin, action: Activate Window Demanding Attention, keys: Ctrl+Alt+A}
  - {component: kwin, action: view_zoom_in, keys: Meta+=}
  # overview and window switching
  - {component: kwin, action: Overview, keys: [Ctrl+Alt+Tab, Meta+Tab]}
  - {component: kwin, action: Expose, keys: Ctrl+F9}
  - {component: kwin, action: ExposeAll, keys: [Launch (C), Ctrl+F10]}
  - {component: kwin, action: ExposeClass, keys: Ctrl+F7}
  - {component: kwin, action: Walk Through Windows, keys: Alt+Tab}
  - {component: kwin, action: Walk Through Windows (Reverse), keys: Alt+Shift+Tab}
  - {component: kwin, action: Walk Through Windows of Current Application, keys: Alt+`}
  - {component: kwin, action: Walk Through Windows of Current Application (Reverse), keys: Alt+~}
  # desktops: A Z / Q S (AZERTY) with Meta or Meta+Ctrl
  - {component: kwin, action: Switch to Desktop 1, keys: [Ctrl+F1, Meta+A, Meta+Ctrl+A]}
  - {component: kwin, action: Switch to Desktop 2, keys: [Ctrl+F2, Meta+Z, Meta+Ctrl+Z]}
  - {component: kwin, action: Switch to Desktop 3, keys: [Ctrl+F3, Meta+Q, Meta+Ctrl+Q]}
  - {component: kwin, action: Switch to Desktop 4, keys: [Ctrl+F4, Meta+S, Meta+Ctrl+S]}
  # Plasma
  - {component: plasmashell, action: activate application launcher, keys: []}
  - {component: plasmashell, action: manage activities, keys: Meta+W}
  - {component: plasmashell, action: previous activity, keys: Meta+Shift+A}
  - {component: plasmashell, action: stop current activity, keys: []}

hooks:
  # Flat pointer acceleration for every mouse KDE has seen: KDE stores it per
  # device, so a new mouse is covered at the next apply.
  - run: flat-mice
    when: always
