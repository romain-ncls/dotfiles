# mutectl: one mute state for the microphone, Discord (the Vencord plugin in
# mutectl-vencord-plugin.ts, built by the discord module) and Teams in Brave
# (chrome-extension/, loaded unpacked from this folder; a Brave policy lets
# Teams reach mutectl-service on localhost without asking). pkg/ builds
# mutectl, its service and lock-afk (KDE Connect's "Lock AFK" command).
# chrome-extension/icons/*.png are rendered from the SVGs next to them:
# icon-16.png from icon-16.svg, the others from icon.svg (rsvg-convert -w N).
services:
  - mutectl.service

shortcuts:
  - name: Mute
    keys: Meta+É
    run: mutectl mute
  - name: Unmute
    keys: Meta+&
    run: mutectl unmute
  - name: AFK
    keys: Meta+"
    run: mutectl afk
  - name: Lock AFK
    keys: Sleep
    run: loginctl lock-session && mutectl afk
  # the Sleep key locks instead of suspending
  - component: org_kde_powerdevil
    action: Sleep
    keys: []
