# Disable the built-in OSC so ModernZ can replace it
osc=no
# Hide the native window title bar
title-bar=no
# Window title = file name (also shown by ModernZ at the top)
title=${filename}
# Prefer original audio: Japanese first (avoids English dubs on anime), then English
alang=ja,en
# English subtitles
slang=en
# Start with the window maximized
window-maximized=yes

# Resume playback where you left off (also remembers audio/subtitle track per file)
save-position-on-quit=yes
# Load the rest of the folder as a playlist (next episode plays automatically)
autocreate-playlist=filter
directory-filter-types=video,audio
# Hardware (GPU) video decoding
hwdec=auto-safe
# Load external subtitles even when their name doesn't exactly match the video
sub-auto=fuzzy
# Keep plain-text subs inside the picture (like VLC) instead of in the black bars
sub-use-margins=no
# Screenshots (s key) as PNG in Pictures/mpv (folder set per OS at the end of this file)
screenshot-format=png
# Allow volume up to 200% (default: 130)
volume-max=200
# Stay open on the last frame at the end instead of closing
keep-open=yes
# Higher-quality scaling (more accurate upscaling/downscaling, better HDR tone mapping)
profile=high-quality

# ---------------------------------------------------------------------------
# Profiles: keep these at the END of the file. Any setting written below a
# [section] line only applies inside that profile.
# ---------------------------------------------------------------------------

# Don't build a playlist for files directly in Downloads (subfolders still do).
# Matches a "Downloads" folder on any OS (C:\Users\nicol\Downloads, ~/Downloads).
[no-playlist-in-downloads]
profile-cond=(path or ''):lower():match('[/\\]downloads[/\\][^/\\]+$') ~= nil
profile-restore=copy
autocreate-playlist=no

# This file is shared between Windows and Linux (dotfiles repo, mpv/). The only
# per-OS settings are paths; mpv's `platform` property picks the right one.
[screenshots-windows]
profile-cond=platform == 'windows'
screenshot-dir=C:/Users/nicol/Pictures/mpv

[screenshots-linux]
profile-cond=platform == 'linux'
screenshot-dir=~/Pictures/mpv
