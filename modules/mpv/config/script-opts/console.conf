# Styling for mpv's built-in menus (track selection, etc.)
# Every value here is changed from the default, which is noted above each line.

# default: 24
font_size=20
# default: 80 (0 = opaque, 255 = fully transparent)
background_alpha=100
# default: 10
padding=14
# default: 8
corner_radius=12
# default: 0.2
gap=0.35
# selected line text, default: #222222
focused_color=#FFFFFF
# selected line background, default: #FFFFFF (darker blue than the accent so white text stays readable)
focused_back_color=#2B7BD4
# characters matching what you type to search, default: #0088FF (would be invisible on the blue highlight)
match_color=#FFD166
