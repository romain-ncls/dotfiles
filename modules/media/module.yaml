# Music and audio: Spotify, EasyEffects (effects on the microphone and the
# headset; its presets are data), the PipeWire graph.
packages:
  - spotify
  - vlc
  - easyeffects
  # EasyEffects' plugins (optional deps on Arch; without them a preset's
  # effects pass the sound through untouched)
  - lsp-plugins-lv2 # expander, equalizer, compressor, limiter
  - deepfilternet-ladspa # DeepFilterNet noise removal
  - crosspipe

user-services:
  - easyeffects.service

window-rules:
  - Description: Spotify on all desktops
    wmclass: Spotify
    wmclassmatch: 1
    desktops: \0
    desktopsrule: 3
    types: 1

breeze-exceptions:
  - Enabled: true
    ExceptionType: 0
    ExceptionPattern: Spotify
    HideTitleBar: true
    BorderSize: 0
    Mask: 0
