# Music and audio: Spotify, EasyEffects (its presets are data), the PipeWire
# graph. EasyEffects no longer starts on its own: fabrial (its own module)
# does the mic now. `systemctl --user start easyeffects` brings it back.
packages:
  - spotify
  - vlc
  - easyeffects
  # EasyEffects' plugins (optional deps on Arch; without them a preset's
  # effects pass the sound through untouched)
  - lsp-plugins-lv2 # expander, equalizer, compressor, limiter
  - deepfilternet-ladspa # DeepFilterNet noise removal
  - crosspipe

window-rules:
  - Description: Spotify on all desktops
    wmclass: Spotify
    wmclassmatch: 1
    desktops: \0
    desktopsrule: 3
    types: 1

breeze-exceptions:
  - Enabled: true
    ExceptionType: 0
    ExceptionPattern: Spotify
    HideTitleBar: true
    BorderSize: 0
    Mask: 0
