# Music and audio: Spotify, EasyEffects (effects on the microphone and the
# headset; its presets are data), the PipeWire graph.
packages:
  - spotify
  - vlc
  - easyeffects
  - crosspipe

user-services:
  - easyeffects.service

window-rules:
  - Description: Spotify on all desktops
    wmclass: Spotify
    wmclassmatch: 1
    desktops: \0
    desktopsrule: 3
    types: 1

breeze-exceptions:
  - Enabled: true
    ExceptionType: 0
    ExceptionPattern: Spotify
    HideTitleBar: true
    BorderSize: 0
    Mask: 0
