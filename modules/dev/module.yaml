# Development: languages, cluster tools, the code font.
packages:
  - go
  - rustup # Rust toolchains (fabrial); once: rustup default stable
  - nodejs-lts-jod # Node 22: bitwarden-cli requires it, and it conflicts with nodejs
  - pnpm
  - deno
  - bun
  - uv
  - python
  - jdk21-openjdk # the LTS in use; jdk-openjdk is 27, not an LTS
  - graphviz # go tool pprof
  - kind
  - kubectl
  - yamllint
  - age
  - tokei
  - just
  - bws-bin # Bitwarden Secrets Manager CLI
  - s5cmd-bin # upstream's release; the source package's tests failed in the install chroot
