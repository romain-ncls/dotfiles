# Laptop hardware (Intel Meteor Lake): graphics and video decode, power,
# firmware updates, SSD trim.
packages:
  - mesa
  - vulkan-intel
  - intel-media-driver
  - libva-utils
  - power-profiles-daemon # Plasma's power profiles
  - thermald
  - fwupd

services:
  - thermald.service
  - fstrim.timer
  - systemd-oomd.service
