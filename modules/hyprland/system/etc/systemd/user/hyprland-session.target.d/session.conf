# What Plasma starts and Hyprland's session target doesn't (docs/hyprland.md):
# the XDG autostart entries (KDE Connect's daemon, pam_kwallet_init,
# Bitwarden, Packet…; those marked OnlyShowIn=KDE stay out by themselves)
# and Plasma's polkit agent, until shadesmar has one.
[Unit]
Wants=xdg-desktop-autostart.target plasma-polkit-agent.service
