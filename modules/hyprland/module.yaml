# Hyprland: a second session next to Plasma, chosen at the login screen
# (plan and decisions: docs/hyprland.md). Its config is Lua, in hypr/,
# linked to ~/.config/hypr and edited in place (hyprctl reload after a
# change: Hyprland doesn't watch Lua files; try it on a copy first).
# dev/ runs it nested in a window of the Plasma session, or headless.
# system/etc/systemd/user/ fits the session into systemd: what it starts,
# what only it runs.
packages:
  - hyprland
  - xdg-desktop-portal-hyprland
  - hyprland-guiutils # permission prompts, the "not responding" dialog
  - quickshell # shadesmar
  - ghostty
  - grim # screenshots
  - slurp # picking a region
  - wl-clipboard
  - brightnessctl
  - playerctl
  # the desktop's own apps, GTK first (docs/hyprland.md, Apps and toolkits):
  # Hyprland's defaults for them in hyprland-mimeapps.list; Plasma keeps KDE's
  - nautilus
  - gvfs # Nautilus's trash and mounts (Plasma uses KIO)
  - papers
  - loupe
  - file-roller
  # stand-ins until shadesmar has its own (docs/hyprland.md, first login);
  # hyprlock stays as the lock screen's fallback (hypr/lock-screen)
  - hyprlock
  - hypridle
  - network-manager-applet # networks, and the VPN's prompts

user-services:
  - hypridle.service
  - hyprland-lid.service

files:
  ~/.config/hypr:
    link: hypr

brave:
  flags:
    # Brave keeps the key to its cookies and saved logins in KWallet in
    # Plasma. In Hyprland it would look in the Secret Service instead, find
    # another key and log out of everything (docs/hyprland.md, Secrets): the
    # same store in both sessions.
    - --password-store=kwallet6
