# Idle (docs/hyprland.md), until shadesmar does it: hypridle, in hyprlang
# (the Hypr tools besides Hyprland keep it). As Plasma on wandersail: the
# screen locks after 6 minutes; on battery it also dims at 5, turns off at
# 10 and suspends at 15; on the charger it stays on. Locking before sleep
# and `loginctl lock-session` (mutectl's Lock AFK) go through lock_cmd.
# Apps' idle inhibitors (video, calls) hold all of it. On battery:
# AC/online is 0.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {
    timeout = 300
    on-timeout = grep -qx 0 /sys/class/power_supply/AC/online && brightnessctl -s set 30%
    on-resume = brightnessctl -r
}

listener {
    timeout = 360
    on-timeout = loginctl lock-session
}

listener {
    timeout = 600
    on-timeout = grep -qx 0 /sys/class/power_supply/AC/online && hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {
    timeout = 900
    on-timeout = grep -qx 0 /sys/class/power_supply/AC/online && systemctl suspend
}
