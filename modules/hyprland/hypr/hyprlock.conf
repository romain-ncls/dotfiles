# The lock screen's fallback (lock-screen: when the Silksong one can't lock,
# or ends while locked): hyprlock, in hyprlang, kept plain. The password
# goes through PAM (/etc/pam.d/hyprlock, from the package).

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    color = rgb(16, 17, 21)
}

label {
    monitor =
    text = $TIME
    font_size = 72
    font_family = Noto Sans
    color = rgb(220, 222, 228)
    position = 0, 120
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    rounding = 12
    outer_color = rgb(60, 64, 74)
    inner_color = rgb(28, 30, 36)
    font_color = rgb(220, 222, 228)
    check_color = rgb(97, 175, 239)
    fail_color = rgb(224, 108, 117)
    placeholder_text = Password
    fade_on_empty = false
    position = 0, -20
    halign = center
    valign = center
}
