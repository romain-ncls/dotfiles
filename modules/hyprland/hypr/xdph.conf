# xdg-desktop-portal-hyprland, which reads this when it starts (hyprlang,
# not Lua). Screen sharing's picker is shadesmar's, with the screens'
# pictures as they're arranged (SharePicker.qml, through
# shadesmar-share-picker: modules/shadesmar/pkg); Hyprland's own without
# the shell. Never remembered: no token to share again without asking.
screencopy {
    custom_picker_binary = shadesmar-share-picker
    allow_token_by_default = false
}
