# xdg-desktop-portal-hyprland, which reads this when it starts (hyprlang,
# not Lua). Screen sharing's picker is shadesmar's, with the screens' and
# windows' pictures, as Plasma's (SharePicker.qml, through
# shadesmar-share-picker: modules/shadesmar/pkg); Hyprland's own without
# the shell. "Allow ... without asking next time" ticked to begin with, as
# Plasma's.
screencopy {
    custom_picker_binary = shadesmar-share-picker
    allow_token_by_default = true
}
