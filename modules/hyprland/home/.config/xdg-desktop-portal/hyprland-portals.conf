# Portals in Hyprland (docs/hyprland.md): Hyprland's (screen sharing,
# screenshots, global shortcuts), then GTK's. The file chooser and the
# settings (dark mode, accent) are KDE's until the GNOME apps come with
# lumar: the same dialog and colors as in Plasma.
[preferred]
default=hyprland;gtk
org.freedesktop.impl.portal.FileChooser=kde
org.freedesktop.impl.portal.Settings=kde;gtk
