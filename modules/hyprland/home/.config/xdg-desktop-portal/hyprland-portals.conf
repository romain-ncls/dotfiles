# Portals in Hyprland (docs/hyprland.md): Hyprland's (screen sharing,
# screenshots, global shortcuts), then GTK's. The file chooser is GNOME's,
# which is Nautilus's own window, for the apps that ask the portal (GTK 4
# apps, Brave); Qt apps keep KDE's dialog, in their own process. The
# settings (dark mode, accent) are KDE's: kdeglobals, in lumar's colors here.
[preferred]
default=hyprland;gtk
org.freedesktop.impl.portal.FileChooser=gnome
org.freedesktop.impl.portal.Settings=kde;gtk
