# Portals in Hyprland (docs/hyprland.md): Hyprland's (screen sharing,
# screenshots, global shortcuts), then GTK's. The file chooser is GTK's,
# for the apps that ask the portal (GTK 4 apps, Brave); Qt apps keep KDE's
# dialog, in their own process. Not GNOME's (Nautilus's window): outside
# GNOME Shell, xdg-desktop-portal-gnome serves only the settings,
# and every download in Brave was cancelled. The settings (dark mode,
# accent) are KDE's: kdeglobals, in lumar's colors here.
[preferred]
default=hyprland;gtk
org.freedesktop.impl.portal.FileChooser=gtk
org.freedesktop.impl.portal.Settings=kde;gtk
