# Brave's new tab, an unpacked extension in ~/.local/share/new-tab
# (loaded by hand, docs/manual-steps.md). Islands of links over Backdrop's
# wallpaper, in the session's colors. The links are private (names of
# servers and clients): ~/.config/new-tab/links.js, not in this repo; their
# format is at the top of newtab.js.
hooks:
  - run: link-data # the links, the tenants, Backdrop's state and lumar's palette, into the extension
    when: always

# The tenant field's search: fetch-tenants lists the tenants hourly from a
# GitHub repo with gh, the repo set in ~/.config/new-tab/tenants.env (private).
user-services:
  - new-tab-tenants.timer

# Without the bar Brave adds under an extension's new tab (the extension's
# name and a Customize button): what its right-click "Hide footer" writes.
json:
  - path: ~/.config/BraveSoftware/Brave-Browser/Default/Preferences
    merge: brave-preferences.json
    unless-running: brave # Brave rewrites its preferences on exit
