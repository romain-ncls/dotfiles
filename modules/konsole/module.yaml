# Konsole as on the NixOS laptop: the "Local default" profile (Fira Code
# Retina 11, 8 px margin, DarkOneNuanced; it runs the login shell) and the
# DarkOne color schemes, which kube switches between. Konsole rewrites the
# profile when it is edited in its settings: bring changes back here.
# The main and session toolbars are hidden by hand (docs/manual-steps.md).
kde:
  konsolerc:
    Desktop Entry:
      DefaultProfile: Local default.profile
    MainWindow:
      MenuBar: Disabled
      StatusBar: Disabled
    KonsoleWindow:
      RememberWindowSize: false
    Notification Messages:
      CloseAllEmptyTabs: true
