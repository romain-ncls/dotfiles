# Konsole as on the NixOS laptop: the "Local default" profile (Fira Code
# Retina 11, 8 px margin; it runs the login shell). Its colors are the host
# variable konsole_colors: Nalthis (from modules/nalthis, with NalthisBlue and
# NalthisRed for kube) on a host with the theme, else DarkOneNuanced (here,
# with DarkOneBlue and DarkOneRed). Konsole rewrites the
# profile when it is edited in its settings: bring changes back here.
# The main and session toolbars are hidden by hand (docs/manual-steps.md).
packages:
  - ttf-fira-code

breeze-exceptions:
  - Enabled: true
    ExceptionType: 0
    ExceptionPattern: org.kde.konsole
    HideTitleBar: true
    BorderSize: 0
    Mask: 0

kde:
  konsolerc:
    Desktop Entry:
      DefaultProfile: Local default.profile
    MainWindow:
      MenuBar: Disabled
      StatusBar: Disabled
    KonsoleWindow:
      RememberWindowSize: false
    Notification Messages:
      CloseAllEmptyTabs: true
