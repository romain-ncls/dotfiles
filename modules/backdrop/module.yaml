# Backdrop: the desktop wallpaper, from Windows Spotlight, Bing and Wallhaven,
# picked by likes and dislikes (its state: ~/.local/share/backdrop, whose
# state.json Oathgate's new tab reads for the current picture and caption).
user-services:
  - backdrop.service

hooks:
  - run: set-wallpaper.sh
    when: always # Plasma gives a screen it has never seen the default image
