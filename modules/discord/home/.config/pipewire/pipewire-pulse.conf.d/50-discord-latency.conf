# In a call, Discord's output asks for 360 samples (7.5 ms), and PipeWire
# runs the whole graph at the smallest latency asked for: 256 samples
# (5.3 ms). Spotify feeds PipeWire from a thread without realtime priority,
# so with the CPU busy it misses that deadline and the music stutters.
# The floor keeps the graph at its default 1024 (21 ms) during a call;
# Discord's voice gains ~14 ms, little next to its own buffering.
pulse.rules = [
  {
    matches = [ { application.process.binary = "Discord" } ]
    actions = { update-props = { pulse.min.quantum = 1024/48000 } }
  }
]
