# hyprslide: a Hyprland plugin of ours (pkg/hyprslide.cpp): the grid's
# desktops as one plane, as KDE's. Switches slide it the way the next
# desktop lies, diagonals included, without the scrolling layout's columns
# beside the screen, a window moved along kept in sight; four fingers on
# the touchpad drag it; a column swapped along the tape is seen passing
# (docs/hyprland.md). modules/hyprland's hyprland.lua loads it, grid.lua
# tells it the grid, binds.lua the swaps. Hyprland
# only loads a plugin built for its exact version: a new Hyprland rebuilds
# it (lodestar upgrade does it right after); until then, or without it, the
# grid fades and slides Hyprland's way.
pkg:
  built-against:
    - hyprland
