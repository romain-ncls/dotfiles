# Claude Code's user settings, status line and instructions. ollama: the
# client that claude-ollama (in ~/.config/fish/conf.d/private.fish) runs
# Claude Code through, against a remote Ollama server.
packages:
  - ollama
  - wl-clipboard # wl-paste: pasting a screenshot into Claude Code

# MCP servers (user scope) live in ~/.claude.json, which Claude Code rewrites
# all the time: merge only our keys. No unless-running: a session is nearly
# always open, and Claude re-reads the file before each write, so the keys
# survive. Playwright runs from Microsoft's image (headless Chromium, nothing
# installed on the host); --network host lets it reach local dev servers.
json:
  - path: ~/.claude.json
    merge: claude.json
