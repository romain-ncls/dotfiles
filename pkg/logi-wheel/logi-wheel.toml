# Wheel settings per app, in Logi Options+ terms.
#   smartshift   true: the wheel goes free-spin when flicked; false: always clicky
#   sensitivity  1-100, how easily SmartShift goes free-spin (Options+ slider)
#   force        1-100, resistance of the clicky wheel (Options+ "scrolling force")
# [app.<name>] matches a window's class or desktop file name (case-insensitive);
# keys left out come from [default]. `journalctl --user -u logi-wheel` shows the
# class of the window each time the profile changes.

[default]
smartshift = true
sensitivity = 88
force = 15

[app.mpv]
smartshift = false
force = 100

[app.readest]
smartshift = false
force = 100

[app.vlc]
smartshift = false
force = 100
